{% extends "layouts/base.html" %}
{% block title %}Notification Preferences | RailCrowd{% endblock %}
{% block content %}
<section class="container py-3" style="max-width:760px"><h1>Notification preferences</h1><p class="text-muted">Choose which in-app updates you want to receive.</p><form method="post" class="card card-body gap-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-check"><input class="form-check-input" type="checkbox" name="report_updates" {% if preference.report_updates %}checked{% endif %}><span class="form-check-label"><strong>My report updates</strong><br><span class="text-muted">Know when an administrator approves or rejects your report.</span></span></label><label class="form-check"><input class="form-check-input" type="checkbox" name="crowd_changes" {% if preference.crowd_changes %}checked{% endif %}><span class="form-check-label"><strong>Saved-train crowd changes</strong><br><span class="text-muted">Receive alerts when approved reports change crowd levels for saved trains.</span></span></label><button class="btn btn-primary align-self-start" type="submit">Save preferences</button></form></section>
{% endblock %}
